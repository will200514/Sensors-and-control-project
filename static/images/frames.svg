<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Noto Sans, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d62728"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2ca02c"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f77b4"/></marker>
  </defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="20" y="28" font-weight="bold">Top view (z up, out of page)</text>
  <rect x="40" y="60" width="18" height="320" fill="#bbb"/>
  <text x="18" y="400" font-size="12" fill="#555">wall</text>
  <rect x="58" y="195" width="8" height="50" fill="#222"/>
  <text x="72" y="190" font-size="12">ArUco ID 1 (0.20 m)</text>
  <circle cx="62" cy="220" r="5" fill="#d62728"/>
  <line x1="62" y1="220" x2="180" y2="220" stroke="#d62728" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="62" y1="220" x2="62" y2="105" stroke="#2ca02c" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="150" y="240" fill="#d62728">x_D</text><text x="72" y="115" fill="#2ca02c">y_D</text>
  <text x="70" y="290" font-size="13">D: dock frame. Origin on the floor</text>
  <text x="70" y="308" font-size="13">below the marker. +x out of the wall,</text>
  <text x="70" y="326" font-size="13">+y along the wall.</text>
  <circle cx="155" cy="220" r="6" fill="none" stroke="#555" stroke-dasharray="3 3"/>
  <text x="100" y="262" font-size="12" fill="#555">target (0.30, 0, pi)</text>
  <g transform="translate(470 150) rotate(150)">
    <circle r="40" fill="#f2f2f2" stroke="#555"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#d62728" stroke-width="2.5" marker-end="url(#r)"/>
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#2ca02c" stroke-width="2.5" marker-end="url(#g)"/>
    <rect x="24" y="-6" width="12" height="12" fill="#1f77b4"/>
  </g>
  <text x="420" y="78" fill="#222">R: robot base frame [x, y, theta]</text>
  <text x="420" y="96" font-size="12" fill="#555">x forward, y left. EKF estimates R in D.</text>
  <line x1="62" y1="220" x2="465" y2="152" stroke="#555" stroke-dasharray="5 4"/>
  <text x="250" y="170" font-size="12" fill="#555">T_DR (estimated)</text>
  <text x="560" y="28" font-weight="bold">Side view: camera on robot</text>
  <line x1="560" y1="360" x2="880" y2="360" stroke="#999"/>
  <rect x="600" y="315" width="120" height="45" rx="6" fill="#f2f2f2" stroke="#555"/>
  <circle cx="620" cy="360" r="6" fill="#d62728"/>
  <text x="590" y="385" font-size="12">R origin</text>
  <rect x="664" y="270" width="16" height="16" fill="#1f77b4"/>
  <line x1="672" y1="278" x2="790" y2="278" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="672" y1="278" x2="672" y2="200" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#b)" transform="rotate(180 672 278)"/>
  <text x="800" y="283" fill="#1f77b4">z_C</text><text x="680" y="350" fill="#1f77b4" font-size="13">y_C (down)</text>
  <text x="600" y="235" font-size="13">C: camera frame (OpenCV)</text>
  <text x="600" y="253" font-size="12" fill="#555">x right, y down, z forward</text>
  <text x="740" y="310" font-size="12" fill="#555">0.06 m ahead, 0.12 m up</text>
</svg>
